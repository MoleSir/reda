[workspace]
members = [
    # Base
    "base/reda-unit",
    "base/reda-unit/codegen", 
    "base/reda-geometry",
    
    # Parse
    "parse/reda-gds",
    "parse/reda-lef",
    "parse/reda-lefdef",
    "parse/reda-def",
    "parse/reda-lib",
    "parse/reda-lib/codegen",
    "parse/reda-sp",
    "parse/reda-v",
    "parse/reda-tf",
    
    # Simulate
    "simulate/reda-spsim",
    
    # Algorithm
    "algorithm/reda-partition",
    "algorithm/reda-placement",
    "algorithm/reda-route", "parse/reda-tf", "tool/reda-tokenize",
]


[workspace.package]
version = "0.1.0"
edition = "2024"
description = "EDA dev kit in Rust"
license = "MIT"


[workspace.dependencies]
# package
reda-unit = { path = "./base/reda-unit", package = "reda-unit", version = "0.2.1" }
reda-unit-macros = { path = "./base/reda-unit/codegen", package = "reda-unit-macros", version = "0.3.1" }
reda-geometry = { path = "./base/reda-geometry", package = "reda-geometry", version = "0.3.0" }

reda-gds = { path = "./parse/reda-gds", package = "reda-gds", version = "0.2.0" }
reda-lef = { path = "./parse/reda-lef", package = "reda-lef", version = "0.2.1" }
reda-lefdef = { path = "./parse/reda-lefdef", package = "reda-lefdef", version = "0.0.1" }
reda-def = { path = "./parse/reda-def", package = "reda-def", version = "0.1.0" }
reda-lib-macro = { path = "./parse/reda-lib/codegen", package = "reda-lib-macro", version = "0.2.1" }
reda-lib = { path = "./parse/reda-lib", package = "reda-lib", version = "0.7.1" }
reda-sp = { path = "./parse/reda-sp", package = "reda-sp", version = "0.2.1" }
reda-v = { path = "./parse/reda-v", package = "reda-v", version = "0.1.1" }
reda-tf = { path = "./parse/reda-tf", package = "reda-tf", version = "0.1.0" }

reda-spsim = { path = "./simulate/reda-spsim", package = "reda-spsim", version = "0.2.1" }

reda-partition = { path = "./algorithm/reda-partition", package = "reda-partition", version = "0.1.0" }
reda-placement = { path = "./algorithm/reda-placement", package = "reda-placement", version = "0.1.0" }
reda-route = { path = "./algorithm/reda-route", package = "reda-route", version = "0.1.0" }

# dependencies
serde_json = "1.0.141"
paste = "1.0"
itertools = "0.14.0"
num-traits = "0.2.19"
rand = "0.9.2"
serde = "1"
chrono = "0.4.41"
thiserror = "2.0.12"
clap = "4.4.0"
libc = "0.2.178"
nom = "6.0"
derive_builder = "0.20.2"
strum = "0.27"
quote = "1.0"
syn = "2.0"
convert_case = "0.8.0"
proc-macro-crate = "3.3.0"
proc-macro2 = "1.0.95"
regex = "1.11.1"
anyhow = "1.0.98"
byteorder = "1.5.0"
libloading = "0.8.7"
log = "0.4.27"
num-complex = "0.4.6"
plotters = "0.3.7"
pest = "2.7"
pest_derive = "2.7"
cc = "1.0"
derive-new = "0.5"

